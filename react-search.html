<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>React 영화 검색</title>

  <!-- React 18 CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Babel (JSX 사용) -->
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

  <!-- 네 공통 디자인 CSS -->
  <link rel="stylesheet" href="style-framework.css">
</head>
<body>

<!-- 헤더 -->
<header>
  <h1>
    <a href="index_movie.html" class="logo-title">
      <img src="images/logo.png" class="logo-img"> 영화정보사이트
    </a>
  </h1>
</header>

<!-- 네비게이션 -->
<nav>
  <a href="index_movie.html">메인</a>
  <a href="react-search.html" style="color:#007bff; font-weight:bold;">React 검색</a>
  <a href="vue-upcoming.html">Vue 예정작</a>
  <a href="angular-comments.html">Angular 댓글</a>
</nav>

<!-- 메인 컨테이너 -->
<div class="container">
  <h2>🎬 React 기반 영화 검색</h2>
  <div id="root"></div>
</div>

<script type="text/babel">
function MovieSearch() {
  const [query, setQuery] = React.useState("");
  const [result, setResult] = React.useState(null);
  const [notFound, setNotFound] = React.useState(false);

  const movies = [
    { title: "미션 임파서블", img: "images/mission.jpg" },
    { title: "하이파이브", img: "images/hi.jpg" },
    { title: "릴로 & 스티치", img: "images/rill.jpg" },
    { title: "나를 모르는 그녀의 세계에서", img: "images/she.jpg" },
    { title: "소주전쟁", img: "images/soju.jpg" }
  ];

  function searchMovie() {
    const match = movies.find(m =>
      m.title.toLowerCase().includes(query.toLowerCase())
    );

    setResult(match || null);
    setNotFound(!match);
  }

  return (
    <div>
      <input
        type="text"
        class="input"
        placeholder="영화 이름 입력"
        value={query}
        onChange={(e) => setQuery(e.target.value)}
        style={{ padding: "10px", width: "200px", borderRadius: "6px" }}
      />

      <button
        onClick={searchMovie}
        class="button"
        style={{ marginLeft: "10px" }}
      >
        검색
      </button>

      {/* 검색 결과 카드 */}
      {result && (
        <div class="card">
          <h3>{result.title}</h3>
          <img src={result.img} width="150" />
        </div>
      )}

      {/* 검색 실패 메시지 */}
      {notFound && (
        <p style={{ color: "red", marginTop: "20px" }}>
          검색 결과가 없습니다.
        </p>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<MovieSearch />);
</script>

</body>
</html>
